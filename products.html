<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Restaurant Menu
    </title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="./menustyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      />
    <script src="./menuItems.js" type="module"></script>
    <script src="./menu.js" type="module"></script>
</head>

<body class="poppins-regular w-full">
     <!--Navigation bar-->
    <section class="sticky top-0 z-50 flex  justify-between items-center p-5 bg-white ">

        <!--name and logo-->
        
        <div class=" flex text-3xl font-bold md:text-4xl font-bold  ">
            <h1>Campus</h1>
            <h1 class="text-[#FF5A4F]">Bite</h1>
        </div>

        <!--menu-- Favorites | Offers & Coupons | Help & Support | About | Settings | Logout-->
        <div class=" md:hidden">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
        </div>
    

        <div class="hidden md:flex gap-6 text-xl  ">
            <a href="" class="hover:text-[#FF5A4F]">Home</a>
            <a href="" class="hover:text-[#FF5A4F]">Restaurants</a>
            <a href="" class="hover:text-[#FF5A4F]">Menu</a>
            <a href="" class="hover:text-[#FF5A4F]">Orders</a>
            <a href="" class="hover:text-[#FF5A4F]">Offers</a>
        </div>

        <!--User profile and Cart-->
        <div class="hidden md:flex gap-6">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-7 h-7">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-7 h-7">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
            </svg>

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-7 h-7" id="viewCart">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>

        </div>
    </section>
    <div class="mob-filter-sort w-screen flex justify-around items-center md:hidden bg-[#FF5A4F] text-white fixed bottom-0 z-100 min-h-[70px]">
        <div class="mobFilter flex justify-between gap-2  items-center" id="mobFilter">
            <i class="fa-solid fa-filter"></i>
            <span>Filter</span>
        </div>
        <div class="mobSort flex justify-between gap-2  items-center" id="mobSort">
            <i class="fa-solid fa-sort"></i>
            <span>Sort</span>
        </div>
    </div>
    <main class="max-w-[1200px] w-full px-[16px] mx-auto my-0 ">
        <!--Banner section-->
        <div class="restaurantMenuPage border border-[#efefef] rounded-t-lg">
            <section id="restaurantBanner"
                class="restaurantBanner border border-[#efefef] rounded-t-lg overflow-hidden ">
                <div class="restaurantBanner__image relative h-[150px] bg-cover bg-no-repeat md:min-h-[300px] md:bg-cover bg-center"
                    style="background-image: linear-gradient(to right, rgba(0, 0, 0, 1),rgba(0, 0, 0, 0.5),rgba(0, 0, 0, 0.5)),url('images/restaurantBanner.jpg');">
                   
                </div>
            </section>
            <!--Main Tabs Section-->
            <section class="mainTabs m-5 hidden">
                <div
                    class="flex gap-3 md:gap-20 justify-between md:justify-start text-center md:border-b md:border-[#efefef] bg-white md:pt-5 md:px-3 md:border md:border-[#efefef]">
                    <a href="#menuSection" class="mainTabLink hover:text-[#FF5A4F] pb-4 active text-sm">
                        Menu
                    </a>
                    <a href="#reviewSection" class="mainTabLink hover:text-[#FF5A4F] text-sm">
                        Reviews
                    </a>
                    <a href="#aboutSection" class="mainTabLink hover:text-[#FF5A4F] text-sm">
                        About
                    </a>
                    <a href="javascript:void(0)" id="viewCart" class="mainTabLink hover:text-[#FF5A4F] text-sm">
                        View Cart
                        <span id="cartCountSpan">
                        </span>
                    </a>
                </div>
            </section>
            <section id="menuSection" class="menuSection">
                <div class="grid grid-wrap md:grid-cols-[0.6fr_2fr]">

                    <div id="menuCategories" class="menuCategories border border-[#efefef] rounded p-5 md:m-5  md:block fixed top-[10%] bottom-0 md:relative md:top-0 left-0 bg-white hidden md:block z-10 shadow-[0px_3px_15px_10px_rgb(0_0_0_/_25%)] md:shadow-none">
                        <h4 class="flex gap-5 justify-between items-center md:block text-md p-5  md:block font-medium bg-[#fef3ed] md:bg-transparent">
                            Categories
                            <div class="filterClose md:hidden" id="filterClose">
                                    <i class="fa-solid fa-close"></i>
                            </div> 
                        </h4>
                        <ul
                            class="menuCategories__list flex flex-row p-3 items-center md:items-start md:flex-col flex-wrap text-sm">
                            <li id="Bestsellers"
                                class="menuCategory w-full p-2 md:p-3 flex items-center md:gap-4 cursor-pointer hover:bg-[#fef3ed] hover:text-[#ff5a4f] justify-between active selected"
                                data-category="Bestsellers">
                                <div>
                                    <i class="fa-solid fa-star mr-2 text-sm text-[#FF5A4F]"></i>
                                    Bestsellers
                                </div>
                                <span class="float-right tick text-[#39C6A5] font-bold" id="tick">
                                    ✓
                                </span>
                            </li>
                            <li id="Veg"
                                class="menuCategory w-full p-2 md:p-3 flex items-center md:gap-4 cursor-pointer hover:bg-[#fef3ed] hover:text-[#ff5a4f] justify-between"
                                data-category="Veg">
                                <div>
                                    <i class="fa-solid fa-leaf mr-2 text-sm text-[#FF5A4F]">
                                    </i>
                                    Veg
                                </div>
                                <span class="float-right tick text-[#39C6A5] font-bold hidden" id="tick">
                                    ✓
                                </span>
                            </li>
                            <li id="Non-Veg"
                                class="menuCategory w-full p-2 md:p-3 flex items-center md:gap-4 cursor-pointer hover:bg-[#fef3ed] hover:text-[#ff5a4f] justify-between"
                                data-category="Non-Veg">
                                <div>
                                    <i class="fa-solid fa-drumstick-bite mr-2 text-sm text-[#FF5A4F]">
                                    </i>
                                    Non-Veg
                                </div>
                                <span class="float-right tick text-[#39C6A5] font-bold hidden" id="tick">
                                    ✓
                                </span>
                            </li>
                            <li id="Burgers"
                                class="menuCategory w-full p-2 md:p-3 flex items-center md:gap-4 cursor-pointer hover:bg-[#fef3ed] hover:text-[#ff5a4f] justify-between"
                                data-category="Burgers">
                                <div>
                                    <i class="fa-solid fa-burger mr-2 text-sm text-[#FF5A4F]">
                                    </i>
                                    Burgers
                                </div>
                                <span class="float-right tick text-[#39C6A5] font-bold hidden" id="tick">
                                    ✓
                                </span>
                            </li>
                            <li id="Fries"
                                class="menuCategory w-full p-2 md:p-3 text-sm flex items-center md:gap-4 cursor-pointer hover:bg-[#fef3ed] hover:text-[#ff5a4f] justify-between"
                                data-category="Fries">
                                <div>
                                    <i class="fa-solid fa-bacon mr-2 text-sm text-[#FF5A4F]">
                                    </i>
                                    Fries
                                </div>
                                <span class="float-right tick text-[#39C6A5] font-bold hidden" id="tick">
                                    ✓
                                </span>
                            </li>
                            <li id="Drinks"
                                class="menuCategory w-full p-2 md:p-3 text-sm flex items-center md:gap-4 cursor-pointer hover:bg-[#fef3ed] hover:text-[#ff5a4f] justify-between"
                                data-category="Drinks">
                                <div>
                                    <i class="fa-solid fa-glass-water mr-2 text-sm text-[#FF5A4F]">
                                    </i>
                                    Drinks
                                </div>
                                <span class="float-right tick text-[#39C6A5] font-bold hidden" id="tick">
                                    ✓
                                </span>
                            </li>
                            <li id="Combos"
                                class="menuCategory w-full p-2 md:p-3 text-sm flex items-center md:gap-4 cursor-pointer hover:bg-[#fef3ed] hover:text-[#ff5a4f] justify-between"
                                data-category="Combos">
                                <div>
                                    <i class="fa-solid fa-seedling mr-2 text-sm text-[#FF5A4F]">
                                    </i>
                                    Combos
                                </div>
                                <span class="float-right tick text-[#39C6A5] font-bold hidden" id="tick">
                                    ✓
                                </span>
                            </li>
                        </ul>
                        <div class="filterAction flex gap-5 justify-around md:hidden">
                            <button id="filterClear" class="px-4 w-[50%] py-1 border border-[#ccc] rounded">Clear</button>
                            <button id="filterApply" class="px-4 w-[50%] py-1 border border-[#ccc] rounded bg-[#FF5A4F] text-white">Apply</button>
                        </div>
                    </div>
                    <div class="allItems md:p-5 border border-[#efefef] rounded p-3 md:m-5 ">
                        <div id="menuSortBy" class="menuSortBy__top md:flex items-center justify-between mb-5  absolute md:relative top-0 left-0 bg-white hidden md:block w-full p-3 md:p-0 fixed top-[30%] bottom-0 md:relative md:top-0 left-0 bg-white hidden md:block z-10 shadow-[0px_3px_15px_10px_rgb(0_0_0_/_25%)]  md:shadow-none" >
                            <h4 class="text-md mb-3 font-medium hidden md:block">
                                All Products
                            </h4>
                            <div class="sortBy text-sm md:flex md:justify-between md:items-center">
                                <label for="sort" class="text-sm flex justify-between flex-wrap md:block p-5 md:p-0 bg-[#fef3ed] md:bg-transparent w-full">
                                    Sort by:
                                   <div class="sortClose md:hidden" id="sortClose">
                                    <i class="fa-solid fa-close"></i>
                                   </div> 
                                   
                                </label>
                                 <select class="p-2 my-5  border border-[#efefef] w-full rounded" name="sortDropdown"
                                        id="sortDropdown">
                                        <option value="default">
                                            Popular
                                        </option>
                                        <option value="priceLowHigh">
                                            Price : Low - High
                                        </option>
                                        <option value="priceHighLow">
                                            Price : High - Low
                                        </option>
                                        <option value="nameAZ">
                                            Name : A - Z
                                        </option>
                                        <option value="nameZA">
                                            Name : Z - A
                                        </option>
                                    </select>
                            </div>
                             <div class="sortAction flex gap-5 justify-around md:hidden">
                            <button id="sortClear" class="px-4 w-[50%] py-1 border border-[#ccc] rounded">Clear</button>
                            <button id="sortApply" class="px-4 w-[50%] py-1 border border-[#ccc] rounded bg-[#FF5A4F] text-white">Apply</button>
                        </div>
                        </div>
                        <div id="menuCard" class="menuCard grid-cols-1 md:grid-cols-2 gap-3 grid">
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
