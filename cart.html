<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart</title>

    <link rel="stylesheet" href="cart.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet"   href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./src/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="./cart.js" type="module"></script>
   
</head>

<body> 
 <!--Navigation bar-->
    <section class="sticky top-0 z-50 flex  justify-between items-center p-5 bg-white ">

        <!--name and logo-->
        
        <div class=" flex text-3xl font-bold md:text-4xl font-bold  ">
            <h1>Campus</h1>
            <h1 class="text-[#FF5A4F]">Bite</h1>
        </div>

        <!--menu-- Favorites | Offers & Coupons | Help & Support | About | Settings | Logout-->
        <div class=" md:hidden">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
        </div>
    

        <div class="hidden md:flex gap-6 text-xl  ">
            <a href="" class="hover:text-[#FF5A4F]">Home</a>
            <a href="" class="hover:text-[#FF5A4F]">Restaurants</a>
            <a href="" class="hover:text-[#FF5A4F]">Menu</a>
            <a href="" class="hover:text-[#FF5A4F]">Orders</a>
            <a href="" class="hover:text-[#FF5A4F]">Offers</a>
        </div>

        <!--User profile and Cart-->
        <div class="hidden md:flex gap-6">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-7 h-7">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-7 h-7">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
            </svg>

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-7 h-7" id="viewCart">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>

        </div>
    </section>
    <div class="cart-container max-w-[1200px] w-full px-[16px] mx-auto my-0" id="cart-container">        <!-- Header -->
        <header class="cart-header">
            <a href="menu.html"><i class="fa-solid fa-arrow-left back-icon"></i></a>
            <a href="menu.html"><h2 class="cart-header__title">My Cart</h2></a>
        </header>
        <!-- Cart Items -->
        <section class="cart-items" id="cartItems"></section>

        <!-- Coupon -->
         <div id="orderTotalSection">
        <section class="coupon-section text-sm">
            <h3>Apply Coupon</h3>
            <div class="coupon-box">
                <input
                    type="text"
                     id="couponInput"
                    placeholder="Enter coupon code"
                >
                <button id="couponBtn">Apply</button>
                <div>
                <p id="couponMessage"></p>
                </div>
            </div>
        </section>


        <!-- Price Summary -->
        <section class="price-summary">

            <div class="price-row">
                <span>Subtotal</span>
                <strong id="subtotalAmount">₹0</strong>
            </div>

            <div class="price-row">
                <span>Delivery Fee</span>
                <strong id="deliveryAmount">₹0</strong>
            </div>

            <div class="price-row discount">
                <span>Discount (CAMPUS20)</span>
                <strong id="disAmount">-₹0</strong>
            </div>

        </section> 


        <!-- Total -->
        <div class="total-section">

            <h2>Total</h2>

            <h2 id="totalVal">₹0</h2>

        </div>

        <!-- Payment Method -->
<section class="payment-section">

    <h3>Payment Method</h3>

    <div class="payment-options">

        <!-- Cash on Delivery -->
        <label class="payment-option">
            <input
                type="radio"
                name="payment"
                value="cod"
                checked
            >

            <span class="payment-content">
                <i class="fa-solid fa-money-bill-wave"></i>
                <span>Cash on Delivery</span>
            </span>
        </label>


        <!-- UPI -->
        <label class="payment-option">
            <input
                type="radio"
                name="payment"
                value="upi"
            >

            <span class="payment-content">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>UPI</span>
            </span>
        </label>


        <!-- Card -->
        <label class="payment-option">
            <input
                type="radio"
                name="payment"
                value="card"
            >

            <span class="payment-content">
                <i class="fa-regular fa-credit-card"></i>
                <span>Card</span>
            </span>
        </label>

    </div>

</section>


        <!-- Checkout -->
        
         
        <a href="checkout.html"><button class="checkout-btn">
            Place Order
        </button>
        </div></a>

    </div>
    <script src="cart.js"></script>

</body>
</html>
