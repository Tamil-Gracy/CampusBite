<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart</title>

    <link rel="stylesheet" href="cart.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet"   href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./src/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="./cart.js" type="module"></script>
   
</head>

<body> 

    <div class="cart-container max-w-[1200px] w-full px-[16px] mx-auto my-0" id="cart-container">        <!-- Header -->
        <header class="cart-header">
            <a href="menu.html"><i class="fa-solid fa-arrow-left back-icon"></i></a>
            <a href="menu.html"><h2 class="cart-header__title">My Cart</h2></a>
        </header>
        <!-- Cart Items -->
        <section class="cart-items" id="cartItems"></section>

        <!-- Coupon -->
         <div id="orderTotalSection">
        <section class="coupon-section text-sm">
            <h3>Apply Coupon</h3>
            <div class="coupon-box">
                <input
                    type="text"
                     id="couponInput"
                    placeholder="Enter coupon code"
                >
                <button id="couponBtn">Apply</button>
                <div>
                <p id="couponMessage"></p>
                </div>
            </div>
        </section>


        <!-- Price Summary -->
        <section class="price-summary">

            <div class="price-row">
                <span>Subtotal</span>
                <strong id="subtotalAmount">₹0</strong>
            </div>

            <div class="price-row">
                <span>Delivery Fee</span>
                <strong id="deliveryAmount">₹0</strong>
            </div>

            <div class="price-row discount">
                <span>Discount (CAMPUS20)</span>
                <strong id="disAmount">-₹0</strong>
            </div>

        </section> 


        <!-- Total -->
        <div class="total-section">

            <h2>Total</h2>

            <h2 id="totalVal">₹0</h2>

        </div>

        <!-- Payment Method -->
<section class="payment-section">

    <h3>Payment Method</h3>

    <div class="payment-options">

        <!-- Cash on Delivery -->
        <label class="payment-option">
            <input
                type="radio"
                name="payment"
                value="cod"
                checked
            >

            <span class="payment-content">
                <i class="fa-solid fa-money-bill-wave"></i>
                <span>Cash on Delivery</span>
            </span>
        </label>


        <!-- UPI -->
        <label class="payment-option">
            <input
                type="radio"
                name="payment"
                value="upi"
            >

            <span class="payment-content">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>UPI</span>
            </span>
        </label>


        <!-- Card -->
        <label class="payment-option">
            <input
                type="radio"
                name="payment"
                value="card"
            >

            <span class="payment-content">
                <i class="fa-regular fa-credit-card"></i>
                <span>Card</span>
            </span>
        </label>

    </div>

</section>


        <!-- Checkout -->
        
         
        <button class="checkout-btn">
            Place Order
        </button>
        </div>

    </div>
    <script src="cart.js"></script>

</body>
</html>
